    * { box-sizing: border-box; margin: 0; padding: 0; }

      min-height: 100vh;

      font-family: "PingFang SC", "HarmonyOS Sans SC", "Microsoft YaHei", system-ui, sans-serif;

      padding: 24px;

    .box { max-width: 520px; }

      font-size: 110px; font-weight: 800; line-height: 1;
      background: linear-gradient(92deg, #7ee7ff, #5b9dff 45%, #c39bff);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 6px 24px rgba(77, 200, 255, .3));
      animation: float 4s ease-in-out infinite;
    }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
    .msg { font-size: 17px; color: #c3d1e6; margin: 14px 0 6px; font-weight: 600; }

    .btns { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    .btn {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 12px 26px; border-radius: 40px;
      text-decoration: none; font-size: 15px; font-weight: 700;
      cursor: pointer; border: none; font-family: inherit;
      transition: transform .2s ease, box-shadow .25s ease;
    }
    .btn:hover { transform: translateY(-2px); }
    .btn:active { transform: scale(.96); }
    .btn-primary {
      background: linear-gradient(135deg, #ff8a5c, #ff5d73 60%, #ff4f9a);
      color: #fff;
      box-shadow: 0 10px 26px rgba(255, 95, 115, .35);
    }
    .btn-ghost {
      background: rgba(77, 216, 255, .14);
      border: 1px solid rgba(120, 210, 255, .45);
      color: #d6e6f7;
    }
    .links { margin-top: 26px; font-size: 12.5px; color: #7d8fab; line-height: 2.2; }
    .links a { color: #9fd8ff; text-decoration: none; margin: 0 6px; }
    .links a:hover { text-decoration: underline; }
  </style>
</head>
